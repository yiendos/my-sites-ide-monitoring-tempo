# Generated by monitoring:tempo-start - do not edit, edit the plugin's stubs/tempo.yaml.
# Tempo in monolithic mode for one developer: everything in one process, local storage in
# /storage (storage/plugins/tempo/).
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

storage:
  trace:
    backend: local
    wal:
      path: /storage/wal
    local:
      path: /storage/blocks

# recent traces live here until they're flushed to blocks - its default, /var/tempo, would lose
# them whenever the container is recreated
live_store:
  wal:
    path: /storage/live-store/traces
  shutdown_marker_dir: /storage/live-store/shutdown-marker

block_builder:
  wal:
    path: /storage/block-builder/traces

# retention is set in both places - the scheduler plans the retention jobs, the worker runs them
backend_scheduler:
  local_work_path: /storage/work
  provider:
    compaction:
      compaction:
        block_retention: __RETENTION__

backend_worker:
  compaction:
    block_retention: __RETENTION__

usage_report:
  reporting_enabled: false
__METRICS_GENERATOR__
